[workspace]
authors = ["Kirby <augustusplasma@gmail.com>"]
channels = ["conda-forge"]
name = "RTL_SDR_Scanner"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
configure = "cmake -S . -B build -G Ninja"
build = "cmake --build build"
test = "ctest --test-dir build --output-on-failure"
run = "build/RTL_SDR_Scanner"
receiver-raw = "python python/receiver_raw.py"
receiver-plot = "python python/receiver_plot.py"
sim-fm-mod = "python simulation/fm/fm_modulation.py"
sim-fm-demod = "python simulation/fm/fm_demodulation.py"
sim-am-mod = "python simulation/am/am_modulation.py"
sim-am-demod = "python simulation/am/am_demodulation.py"
sim-ADS-B-mod = "python simulation/ADS-B/ADS-B_modulation.py"
sim-ADS-B-demod = "python simulation/ADS-B/ADS-B_demodulation.py"
sim-ADS-B = "python simulation/ADS-B/ADS-B_modulation.py && python simulation/ADS-B/ADS-B_demodulation.py"

[dependencies]
python = "3.14.*"
numpy = ">=2.5.1,<3"
scipy = ">=1.18.0,<2"
matplotlib = ">=3.11.0,<4"
cmake = ">=4.3.4,<5"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
cxx-compiler = ">=1.11.0,<2"
fftw = ">=3.3.10,<4"
spdlog = ">=1.16.0,<2"
nlohmann_json = ">=3.12.0,<4"
alsa-lib = ">=1.2.14,<2"
